<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#1a2332"/>
  <text x="24" y="36" fill="#e8eef7" font-family="Georgia, serif" font-size="22">04 — HUD, clock, fail</text>
  <rect x="40" y="70" width="720" height="380" rx="8" fill="#243044"/>
  <text x="60" y="110" fill="#fff" font-size="28" font-family="sans-serif" font-weight="700">12</text>
  <text x="60" y="128" fill="#8aa0b8" font-size="11" font-family="sans-serif">SCORE</text>
  <text x="160" y="110" fill="#7dffb3" font-size="20" font-family="sans-serif">x4</text>
  <text x="160" y="128" fill="#8aa0b8" font-size="11" font-family="sans-serif">STREAK</text>
  <!-- clock bar -->
  <rect x="280" y="88" width="360" height="18" rx="9" fill="#1a2332"/>
  <rect x="280" y="88" width="140" height="18" rx="9" fill="#e85d04"/>
  <text x="650" y="102" fill="#e8eef7" font-size="12" font-family="sans-serif">L(n)=1.9s</text>
  <!-- fail overlay sample -->
  <rect x="200" y="200" width="400" height="180" rx="10" fill="#000" opacity="0.45"/>
  <text x="300" y="270" fill="#ff5a5a" font-size="28" font-family="sans-serif" font-weight="700">AIR BALL</text>
  <text x="270" y="310" fill="#e8eef7" font-size="14" font-family="sans-serif">timeout or path missed hoop</text>
  <text x="310" y="350" fill="#ffcc33" font-size="13" font-family="sans-serif">TAP — try run again</text>
</svg>
