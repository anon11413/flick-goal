// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 8.13.2 = the highest AGP any plugin asks for (RevenueCat); Gradle uses the root version for all modules.
        classpath 'com.android.tools.build:gradle:8.13.2'
        // Kotlin Gradle plugin on the ROOT classpath (the AdMob + RevenueCat plugins are Kotlin), so it is
        // loaded once instead of once per plugin module.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
