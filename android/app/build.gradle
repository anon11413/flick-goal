apply plugin: 'com.android.application'

// ---- Flick Goal: version + release signing -------------------------------------------------------
// versionName / versionCode come from ../version.properties, which scripts/android-config.mjs writes
// (versionName = CONFIG.version in src/config.js; versionCode = --version-code, CI uses 1000 + run number).
// Google Play needs a HIGHER versionCode for every upload.
def fgVersion = new Properties()
def fgVersionFile = rootProject.file('version.properties')
if (fgVersionFile.exists()) {
    fgVersionFile.withInputStream { fgVersion.load(it) }
}
def fgVersionCode = (fgVersion.getProperty('versionCode') ?: '1').trim().toInteger()
def fgVersionName = (fgVersion.getProperty('versionName') ?: '1.0.0').trim()

// Release signing uses the UPLOAD key, read ONLY from environment variables (GitHub Actions secrets,
// see .github/workflows/android.yml). Nothing secret is ever stored in this repository.
// When ANDROID_KEYSTORE_PATH is not set, release builds are simply left unsigned.
def fgKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def fgCanSign = fgKeystorePath != null && !fgKeystorePath.isEmpty() && file(fgKeystorePath).exists()

android {
    namespace = "com.flickgoal.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Package name: must match capacitor.config.json "appId" and src/config.js store.androidAppId.
        // PERMANENT once the first build is uploaded to Google Play.
        applicationId "com.flickgoal.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode fgVersionCode
        versionName fgVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (fgCanSign) {
            release {
                storeFile file(fgKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                // PKCS#12 (.p12, made with openssl) and JKS (.jks, made with keytool) both work.
                storeType fgKeystorePath.toLowerCase().endsWith('.jks') ? 'jks' : 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (fgCanSign) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
