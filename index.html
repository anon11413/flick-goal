<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Flick Goal</title>
  <meta name="description" content="Flick Goal — a one-tap field goal arcade game. Time your flick, split the uprights, chase the streak." />
  <meta name="theme-color" content="#4FC3F7" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flick Goal" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="Flick Goal game field"></canvas>
    <div id="ui"></div>
    <div id="fx" aria-hidden="true"></div>
    <div id="overlay"></div>

    <!-- Shown until main.js boots; replaced with an error card if boot fails. -->
    <div id="boot" aria-live="polite">
      <div class="boot-logo"><span>FLICK</span><span>GOAL</span></div>
      <div class="boot-dots"><i></i><i></i><i></i></div>
    </div>
    <noscript><div class="boot-error">Flick Goal needs JavaScript to run.</div></noscript>
  </div>
  <div id="rotate" aria-hidden="true"><div class="rot-phone"></div>Turn your phone upright</div>

  <script>
    // Boot watchdog: if the module graph fails to load or throws before boot, show a friendly
    // retry card instead of a blank screen. (Plain script so it runs even if modules fail.)
    (function () {
      function fail() {
        if (window.__flickGoalBooted) return;
        var b = document.getElementById('boot');
        if (!b || b.getAttribute('data-failed')) return;
        b.setAttribute('data-failed', '1');
        b.innerHTML = '<div class="boot-logo"><span>FLICK</span><span>GOAL</span></div>' +
          '<div class="boot-msg">Couldn’t start the game.</div>' +
          '<button type="button" class="boot-retry">TAP TO RETRY</button>';
        b.querySelector('button').addEventListener('click', function () { location.reload(); });
      }
      window.addEventListener('error', function (e) {
        if (!window.__flickGoalBooted && (e.target && e.target.tagName === 'SCRIPT' || e.error)) fail();
      }, true);
      window.addEventListener('unhandledrejection', function () { if (!window.__flickGoalBooted) fail(); });
      setTimeout(function () { if (!window.__flickGoalBooted) fail(); }, 15000);
    })();
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
