<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Flick Goal</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #1a1030; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: "Trebuchet MS", ui-rounded, sans-serif; color: #fff;
    }
    #wrap {
      width: min(420px, 100vw); height: min(780px, 100vh);
      position: relative; border-radius: 28px; overflow: hidden;
      box-shadow: 0 20px 60px #0008;
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
    #ui {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; padding: 14px 16px;
    }
    #clock {
      width: 70%; height: 10px; background: #0004; border-radius: 99px; overflow: hidden;
    }
    #clock > i { display: block; height: 100%; width: 100%; background: #fff; border-radius: 99px; }
    #score { font-size: 56px; font-weight: 800; text-shadow: 0 5px 0 #0002; line-height: 1.1; margin-top: 8px; }
    #tiny { font-size: 12px; opacity: .85; text-align: center; }
    #modes { pointer-events: auto; display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
    #modes button {
      border: 0; border-radius: 99px; padding: 6px 12px; font-weight: 800; cursor: pointer;
      background: #fff3; color: #fff;
    }
    #modes button.on { background: #fff; color: #5b3cc4; }
    #hint {
      margin-top: auto; margin-bottom: 24px; background: #fff; color: #5b3cc4;
      font-weight: 800; padding: 12px 22px; border-radius: 999px;
      pointer-events: auto; border: 0; font-size: 16px; cursor: pointer;
      box-shadow: 0 6px 0 #c9b8ff;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="420" height="780"></canvas>
    <div id="ui">
      <div id="clock"><i id="clocki"></i></div>
      <div id="score">0</div>
      <div id="tiny">flies through · lands · camera follows · posts low to high</div>
      <div id="modes">
        <button type="button" id="mFloat" class="on">floating</button>
        <button type="button" id="mTall">grounded / taller</button>
        <button type="button" id="mDebug">debug zone</button>
      </div>
      <button id="hint" type="button">TAP TO FLICK</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const W = 420, H = 780, GROUND = 640, G = 980, POWER = 1180;
    const A0 = Math.PI / 2, A1 = 0.12;
    const D_MIN = 0.11, TEE_X = 108, BALL_R = 16, REST = 0.58;
    const Y_TOP = H * 0.25, POST_H = 128, SLACK = 26;

    let mode = "float", debugZone = false;
    let score = 0, state = "ready";
    let t = 0, dir = 1, last = performance.now();
    let ball = { x: TEE_X, y: GROUND - BALL_R, vx: 0, vy: 0 };
    let trail = [], posts = [];
    let cam = 0, camTo = 0;
    let shake = 0, flash = 0, clock = 6, clockMax = 6, scored = false;

    const $score = document.getElementById("score");
    const $hint = document.getElementById("hint");
    const $bar = document.getElementById("clocki");

    function sx(x) { return x - cam; }
    function angle() { return A0 + (A1 - A0) * t; }
    function distOf(n) { return 200 + Math.min(n, 35) * 11; }
    function gapOf(n) { return POST_H + SLACK; }
    function spdOf(n) {
      const band = Math.max(0.07, 90 / 480);
      const vmax = Math.min(0.9, band / D_MIN);
      return 0.26 + (vmax - 0.26) * (1 - Math.exp(-n / 12));
    }
    function LOf(n) {
      const T = 2 / Math.max(0.15, spdOf(n));
      const Lmin = 0.18 + T / 2 + D_MIN;
      return Math.max(Lmin, 6.2 * Math.exp(-n / 16) + Lmin);
    }

    function yAt(origin, a, goalX) {
      const vx = Math.cos(a) * POWER, vy0 = -Math.sin(a) * POWER;
      const dx = goalX - origin.x;
      if (vx < 8) return origin.y;
      const T = dx / vx;
      return origin.y + vy0 * T + 0.5 * G * T * T;
    }

    function placePost(origin) {
      const d = distOf(score);
      const goalX = origin.x + d;
      const yLo = Y_TOP + 20, yHi = GROUND - 50;
      let mid, aStar, tries = 0;
      do {
        aStar = A0 + (A1 - A0) * (0.08 + Math.random() * 0.84);
        mid = yAt(origin, aStar, goalX);
        tries++;
      } while ((mid < yLo || mid > yHi) && tries < 24);
      mid = Math.max(yLo, Math.min(yHi, mid));
      const bar = Math.min(GROUND - 40, mid + POST_H * 0.42);
      return { x: goalX, bar, postH: POST_H, slack: SLACK, pop: 0, done: false };
    }

    function boot() {
      score = 0; t = 0.15; dir = 1; scored = false;
      ball = { x: TEE_X, y: GROUND - BALL_R, vx: 0, vy: 0 };
      cam = 0; camTo = 0; trail = [];
      posts = [placePost(ball)];
      clockMax = LOf(0); clock = clockMax;
      state = "aim";
      $score.textContent = "0";
      $hint.textContent = "TAP TO FLICK";
      $hint.style.visibility = "visible";
    }

    function flick() {
      if (state !== "aim") return;
      const a = angle();
      ball.vx = Math.cos(a) * POWER;
      ball.vy = -Math.sin(a) * POWER;
      trail = []; scored = false; state = "fly";
      $hint.style.visibility = "hidden";
    }

    function onTap() {
      if (state === "dead" || state === "ready") { boot(); return; }
      if (state === "aim") flick();
    }
    canvas.addEventListener("pointerdown", onTap);
    $hint.addEventListener("click", e => { e.stopPropagation(); onTap(); });
    document.getElementById("mFloat").onclick = () => setMode("float");
    document.getElementById("mTall").onclick = () => setMode("tall");
    document.getElementById("mDebug").onclick = () => {
      debugZone = !debugZone;
      document.getElementById("mDebug").classList.toggle("on", debugZone);
    };
    function setMode(m) {
      mode = m;
      document.getElementById("mFloat").classList.toggle("on", m === "float");
      document.getElementById("mTall").classList.toggle("on", m === "tall");
      if (state !== "ready") boot();
    }

    function through(p, y) {
      const top = p.bar - p.postH - p.slack;
      return y <= p.bar - 2 && y >= top;
    }

    function inWindow(p, y) {
      return y < p.bar - 6 && y > p.bar - p.postH - p.slack;
    }

    function segs(p) {
      const x = p.x, bar = p.bar;
      const out = [];
      if (!inWindow(p, ball.y)) {
        out.push([x - 16, bar, x + 16, bar]);
      }
      if (mode === "tall") out.push([x, bar + 8, x, GROUND]);
      else out.push([x, bar + 8, x, bar + 22]);
      return out;
    }

    function hitSeg(ax, ay, bx, by) {
      const px = ball.x, py = ball.y, r = BALL_R + 3;
      const abx = bx - ax, aby = by - ay;
      const apx = px - ax, apy = py - ay;
      const ab2 = abx * abx + aby * aby || 1;
      let u = (apx * abx + apy * aby) / ab2;
      u = Math.max(0, Math.min(1, u));
      const cx = ax + abx * u, cy = ay + aby * u;
      const dx = px - cx, dy = py - cy;
      const d2 = dx * dx + dy * dy;
      if (d2 >= r * r) return false;
      const d = Math.sqrt(d2) || 1;
      const nx = dx / d, ny = dy / d;
      ball.x += nx * (r - d);
      ball.y += ny * (r - d);
      const vn = ball.vx * nx + ball.vy * ny;
      if (vn < 0) {
        ball.vx -= (1 + REST) * vn * nx;
        ball.vy -= (1 + REST) * vn * ny;
      }
      ball.vx *= 0.92;
      return true;
    }

    function update(dt) {
      shake *= 0.85; flash *= 0.9;
      posts.forEach(p => { p.pop = Math.min(1, p.pop + dt * 5); });
      camTo = ball.x - TEE_X;
      cam += (camTo - cam) * Math.min(1, dt * 3.2);

      if (state === "aim") {
        t += dir * spdOf(score) * dt;
        if (t > 1) { t = 1; dir = -1; }
        if (t < 0) { t = 0; dir = 1; }
        clock -= dt;
        if (clock <= 0) fail("TIME — TAP");
      }

      if (state === "fly") {
        const steps = 8;
        for (let i = 0; i < steps; i++) {
          const sdt = dt / steps;
          const x0 = ball.x, y0 = ball.y;
          ball.vy += G * sdt;
          ball.x += ball.vx * sdt;
          ball.y += ball.vy * sdt;

          for (const p of posts) {
            for (const s of segs(p)) hitSeg(s[0], s[1], s[2], s[3]);
            if (p.done) continue;
            if (x0 <= p.x && ball.x >= p.x) {
              const u = (p.x - x0) / (ball.x - x0 || 1e-6);
              const y = y0 + (ball.y - y0) * u;
              if (through(p, y)) {
                p.done = true;
                scored = true;
                score += 1;
                $score.textContent = score;
                flash = 1; shake = 6;
              }
            }
          }

          if (ball.y >= GROUND - BALL_R) {
            ball.y = GROUND - BALL_R;
            ball.vx = 0; ball.vy = 0;
            if (scored) land();
            else fail("NO GOOD — TAP");
            return;
          }
        }
        trail.push({ x: ball.x, y: ball.y });
        if (trail.length > 40) trail.shift();
        if (ball.x > cam + W + 200) fail("NO GOOD — TAP");
      }

      const r = Math.max(0, clock / clockMax);
      $bar.style.width = (r * 100) + "%";
      $bar.style.background = r < 0.28 ? "#ff6b4a" : "#fff";
    }

    function land() {
      trail = [];
      posts = [placePost(ball)];
      t = Math.random() * 0.3;
      clockMax = LOf(score); clock = clockMax;
      state = "aim";
      $hint.style.visibility = "visible";
    }

    function fail(msg) {
      state = "dead";
      $hint.textContent = msg;
      $hint.style.visibility = "visible";
    }

    function sky() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#7ad7ff"); g.addColorStop(0.55, "#b4ecff"); g.addColorStop(1, "#7ed957");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      if (flash > 0.04) { ctx.fillStyle = `rgba(255,255,180,${flash * 0.3})`; ctx.fillRect(0, 0, W, H); }
      ctx.fillStyle = "#fff";
      const par = cam * 0.15;
      ctx.beginPath(); ctx.arc(70 - par % 500, 95, 30, 0, 7); ctx.arc(100 - par % 500, 100, 24, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(280 - par % 500, 80, 26, 0, 7); ctx.arc(308 - par % 500, 86, 20, 0, 7); ctx.fill();
    }
    function ground() {
      ctx.fillStyle = "#5ac85a"; ctx.fillRect(0, GROUND, W, H - GROUND);
      ctx.fillStyle = "#6ed66e"; ctx.fillRect(0, GROUND, W, 16);
      ctx.strokeStyle = "#ffffff33"; ctx.lineWidth = 2;
      const s = -((cam % 70));
      ctx.beginPath();
      for (let x = s; x < W; x += 70) { ctx.moveTo(x, GROUND + 20); ctx.lineTo(x, H); }
      ctx.stroke();
    }

    function drawPostLayer(p, which) {
      const x = sx(p.x), bot = p.bar, top = p.bar - p.postH;
      const farX = x - 11, nearX = x + 11;
      const s = 0.2 + p.pop * 0.8;
      ctx.save();
      ctx.translate(x, bot); ctx.scale(s, s); ctx.translate(-x, -bot);
      ctx.strokeStyle = "#ffd000";
      ctx.lineCap = "round"; ctx.lineJoin = "round";

      if (which === "far") {
        if (mode === "tall") {
          ctx.lineWidth = 8;
          ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x, bot); ctx.stroke();
          ctx.fillStyle = "#2d8a38";
          ctx.fillRect(x - 10, GROUND - 36, 20, 36);
        } else {
          ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(x, bot + 16); ctx.lineTo(x, bot); ctx.stroke();
        }
        ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(farX, bot); ctx.lineTo(farX, top - 36); ctx.stroke();
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(farX, bot); ctx.lineTo(nearX, bot); ctx.stroke();
        ctx.fillStyle = "#ff7a18";
        ribbon(farX, top - 36);
      }
      if (which === "near") {
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(nearX, bot); ctx.lineTo(nearX, top - 40); ctx.stroke();
        ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(farX, bot); ctx.lineTo(nearX, bot); ctx.stroke();
        ctx.fillStyle = "#ff7a18";
        ribbon(nearX, top - 40);
      }
      ctx.restore();
    }
    function ribbon(x, y) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 12, y + 5); ctx.lineTo(x, y + 9); ctx.fill();
    }

    function drawAim() {
      if (state !== "aim") return;
      const a = angle();
      const x = sx(ball.x), y = ball.y;
      ctx.strokeStyle = "rgba(255,255,255,.92)";
      ctx.lineWidth = 5; ctx.setLineDash([9, 7]);
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * 148, y - Math.sin(a) * 148); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#5b3cc4"; ctx.font = "800 14px Trebuchet MS";
      ctx.fillText(`${Math.round(a * 180 / Math.PI)}°`, x + 10, y - 20);
    }

    function football(x, y, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.fillStyle = "#c45c26";
      ctx.beginPath(); ctx.ellipse(0, 0, 20, 13, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.stroke();
      ctx.restore();
    }

    function drawBall() {
      if (trail.length > 1 && state === "fly") {
        ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(sx(trail[0].x), trail[0].y);
        trail.forEach(p => ctx.lineTo(sx(p.x), p.y)); ctx.stroke();
      }
      const rot = state === "fly" ? Math.atan2(ball.vy, ball.vx) : -0.35;
      football(sx(ball.x), ball.y, rot);
    }

    function draw() {
      ctx.save();
      ctx.translate((Math.random() - 0.5) * shake, 0);
      sky(); ground();
      const p = posts[0];
      if (p && debugZone) {
        ctx.fillStyle = "rgba(80,255,140,0.35)";
        ctx.strokeStyle = "rgba(40,220,100,0.95)";
        ctx.lineWidth = 2;
        const top = p.bar - p.postH - p.slack;
        ctx.fillRect(sx(p.x) - 18, top, 36, p.bar - top);
        ctx.strokeRect(sx(p.x) - 18, top, 36, p.bar - top);
      }
      if (p) drawPostLayer(p, "far");
      if (!p || ball.x < p.x) drawBall();
      if (p) drawPostLayer(p, "near");
      if (p && ball.x >= p.x) drawBall();
      drawAim();
      ctx.restore();
    }

    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (state === "ready") {
        sky(); ground(); football(TEE_X, GROUND - BALL_R, -0.35);
      } else { update(dt); draw(); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
